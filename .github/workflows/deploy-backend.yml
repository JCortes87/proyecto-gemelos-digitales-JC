# ----------------------------------------------------------------------------
# Workflow de deploy automatico del backend a AWS ECS.
#
# Se dispara cuando:
#   - Hay un push a la rama main que cambia algo en gemelo-digital-backend/
#     o en el propio archivo del workflow.
#   - Se ejecuta manualmente desde la pestana Actions de GitHub.
#
# Lo que hace:
#   0. Corre los tests del backend (ci.yml via workflow_call). Si fallan, no
#      se despliega.
#   1. Checkout del codigo.
#   2. Asume el rol IAM en AWS via OIDC (sin Access Keys ni secretos).
#   3. Hace login en el registry ECR.
#   4. Construye la imagen Docker del backend desde gemelo-digital-backend/
#      (linux/amd64, sin provenance/sbom: Fargate rechaza OCI index).
#   5. La sube a ECR taggeada con el SHA del commit y como 'latest'.
#   6. Registra una nueva revision de la task definition ACTUAL del servicio
#      con la imagen fijada por digest (repo@sha256:...) y actualiza el
#      servicio a esa revision (dispara el canary + circuit breaker).
#   7. Espera a que el servicio quede estable antes de marcar el job como ok.
# ----------------------------------------------------------------------------
name: Deploy backend a ECS

on:
  push:
    branches:
      - main
    paths:
      - 'gemelo-digital-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Garantiza que no haya dos deploys del backend corriendo al tiempo.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

# Permisos requeridos para que GitHub Actions pueda solicitar el token OIDC.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '718624265053'
  ECR_REPOSITORY: gemelo-backend
  ECS_CLUSTER: default
  ECS_SERVICE: gemelo-digital-api
  IAM_ROLE_ARN: arn:aws:iam::718624265053:role/GemeloDigitalDeployerRole

jobs:
  tests:
    name: Tests backend
    uses: ./.github/workflows/ci.yml
    with:
      backend: true
      frontend: false

  deploy:
    name: Construir imagen y actualizar servicio ECS
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy-backend

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir, taggear y subir imagen Docker
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: gemelo-digital-backend
        run: |
          # Fargate SOLO acepta un manifiesto de una plataforma: sin
          # provenance/sbom (BuildKit los agrega como OCI image index).
          docker buildx build \
            --platform linux/amd64 --provenance=false --sbom=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --metadata-file "$RUNNER_TEMP/build-meta.json" \
            --push \
            .
          DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-meta.json")
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            # Respaldo: pedir el digest a ECR por el tag inmutable (SHA).
            DIGEST=$(aws ecr describe-images \
              --repository-name $ECR_REPOSITORY \
              --image-ids imageTag=$IMAGE_TAG \
              --query 'imageDetails[0].imageDigest' --output text \
              --region ${{ env.AWS_REGION }})
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Registrar task definition con la imagen por digest y desplegar
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          # Parte de la task definition que el servicio usa HOY (asi se
          # conservan secrets, env, roles, logs, cpu/memoria) y solo cambia la
          # imagen del contenedor del backend (puerto 8000).
          CURRENT_TD=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' --output text \
            --region ${{ env.AWS_REGION }})
          echo "Task definition actual: $CURRENT_TD"
          aws ecs describe-task-definition --task-definition "$CURRENT_TD" \
            --query 'taskDefinition' --output json \
            --region ${{ env.AWS_REGION }} > "$RUNNER_TEMP/td-current.json"

          jq --arg IMG "$IMAGE" '
            .containerDefinitions |= (
              if length == 1 then map(.image = $IMG)
              else map(if ([.portMappings[]?.containerPort] | index(8000)) != null
                       then .image = $IMG else . end)
              end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy,
                  .deregisteredAt)
          ' "$RUNNER_TEMP/td-current.json" > "$RUNNER_TEMP/td-new.json"

          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/td-new.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text \
            --region ${{ env.AWS_REGION }})
          echo "Nueva task definition: $NEW_TD"

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition "$NEW_TD" \
            --region ${{ env.AWS_REGION }}

      - name: Esperar a que el servicio quede estable
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Resumen del deploy
        run: |
          echo "Backend desplegado correctamente."
          echo "Imagen: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "Servicio ECS: ${{ env.ECS_CLUSTER }}/${{ env.ECS_SERVICE }}"
